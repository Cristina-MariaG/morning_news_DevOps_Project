global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - 'alert.rules.yml'

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ['localhost:9090']

  - job_name: 'ne_prometheus'
    metrics_path: /metrics
    static_configs:
      - targets: ['13.38.8.121:9100']

  - job_name: 'ne_miksiei_backend'
    metrics_path: /metrics
    static_configs:
      - targets: ['35.180.131.94:9100']

  - job_name: 'ne_miksiei_frontend'
    metrics_path: /metrics
    static_configs:
      - targets: ['13.38.128.231:9100']

  - job_name: 'blackbox'
    metrics_path: '/probe'
    params:
      module: ['http_2xx']
    relabel_configs:
      - source_labels: ['__address__']
        target_label: '__param_target'
      - source_labels: ['__param_target']
        target_label: 'instance'
      - target_label: '__address__'
        replacement: 'blackbox-exporter:9115'
    scrape_interval: 1m
    static_configs:
      - targets:
          ['https://frontend.test.miksiei.fr/', 'https://backend.test.miksiei.fr/', 'https://frontend.miksiei.fr/', 'https://backend.miksiei.fr/']
alerting:
  alertmanagers:
    - static_configs:
        - targets:
            - alertmanager:9093
