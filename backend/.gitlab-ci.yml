image: node:18.20

stages:
  - test
  - build
  - deploy

test:
  stage: test
  script:
    - yarn add --dev jest
    - yarn test
  rules:
    - if: "$CI_PIPELINE_SOURCE == 'merge_request_event' && $CI_MERGE_REQUEST_TARGET_BRANCH_NAME == 'pre-prod'"

eslint-test:
  stage: test
  image: node:18.20
  script:
    - yarn install
    - yarn eslint
  rules:
    - if: "$CI_PIPELINE_SOURCE == 'merge_request_event' && $CI_MERGE_REQUEST_TARGET_BRANCH_NAME == 'dev'"

variables:
  SONAR_USER_HOME: "${CI_PROJECT_DIR}/.sonar" 
  GIT_DEPTH: "0"  
sonarcloud-check:
  image:
    name: sonarsource/sonar-scanner-cli:latest
    entrypoint: [""]
  cache:
    key: "${CI_JOB_NAME}"
    paths:
      - .sonar/cache
  script:
    - sonar-scanner
  only:
    - merge_requests
    - pre-prod

build_publish_image:
  stage: build
  image: docker:20.10.16
  services:
    - docker:20.10.16-dind
  script:
    - docker login -u $USERNAME_DOCKERHUB -p $PASSWORD_DOCKERHUB
    - docker build -t $USERNAME_DOCKERHUB/$PROJECT_NAME_DOCKERHUB .
    - docker push $USERNAME_DOCKERHUB/$PROJECT_NAME_DOCKERHUB
  rules:
    - if: "$CI_PIPELINE_SOURCE == 'merge_request_event' && $CI_MERGE_REQUEST_TARGET_BRANCH_NAME == 'pre-prod'" 

update_docker_image_prod:
  stage: deploy
  image: debian:stable
  before_script:
  - apt-get update 
  - apt-get install -y openssh-client
  - mkdir -p ~/.ssh
  - echo "$MIKSIEI_KEY_SSH_FINAL_PROJECT" > ~/.ssh/temp_ssh_key
  - chmod 600 ~/.ssh/temp_ssh_key
  script:
    - ssh -T -o StrictHostKeyChecking=no -i ~/.ssh/temp_ssh_key admin@$PUBLIC_IP_EC2_INSTANCE "docker compose pull && docker compose up -d"   
    - rm ~/.ssh/temp_ssh_key
  dependencies:
    - build_publish_image
  rules:
    - if: "$CI_PIPELINE_SOURCE == 'merge_request_event' && $CI_MERGE_REQUEST_TARGET_BRANCH_NAME == 'pre-prod'" 
