server {
    listen 80;
    listen [::]:80;

    server_name backend.test.miksiei.fr www.backend.test.miksiei.fr;
    server_tokens off;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://backend.test.miksiei.fr$request_uri;
    }
}
